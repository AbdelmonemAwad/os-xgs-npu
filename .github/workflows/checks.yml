name: checks

# What a change here has to survive before it can be merged.
#
# Everything is cheap and deterministic: it parses files and compares them with each other.
# There is no Sophos appliance on a GitHub runner, no USB-SPI bridge to talk to and no
# coprocessor to release, so this does not pretend to test behaviour. It catches the mistakes
# that have actually been made while this was being written:
#
#   * a Python file with a syntax error, or a name used and never defined, found after it was
#     copied onto a firewall with no network;
#   * a shell script that will not parse, in a path that only runs at boot or only runs as root
#     halfway through a package install;
#   * an address, a MAC or a serial number from the machine this was measured on, left in a
#     document - the hardware identifiers here are real and there are a lot of them;
#   * Arabic written straight into code instead of a catalogue;
#
# WHAT IS NOT CHECKED HERE, and they are the most important files in the repository: the drivers
# themselves - contrib/npuep/*.c for ARMADA and contrib/octep/*.c for OCTEON TX. They are written
# against FreeBSD kernel headers and cannot be compiled on a Linux runner at all. They are built on the appliance by
# the appliance's own clang, with every warning fatal. A green tick here says nothing about
# them, and nothing whatever about whether the coprocessor is still writing where it should.
# codeql.yml reads them without building them, for the mistakes that become vulnerabilities - a
# reading, not a compile.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    name: syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Python
        run: |
          shopt -s globstar nullglob
          files=(src/**/*.py tools/**/*.py)
          [ ${#files[@]} -gt 0 ] || { echo "no Python here"; exit 0; }
          python3 -m compileall -q "${files[@]}"
          # compileall is the parser; this is the part it does not do - a name used and never
          # defined, an import that is not there.
          python3 -m pip install --quiet pyflakes
          python3 -m pyflakes "${files[@]}"

      - name: Shell
        run: |
          shopt -s globstar nullglob
          # install/ is run by the person installing, src/etc/rc.syshook.d is run by the system
          # at boot, and pkg/ is run by pkg(8) as root in the middle of an install or a removal.
          # Every one of them is a place where a syntax error is found too late - and the boot
          # hook is the one that, broken, leaves an appliance with no network interfaces and no
          # obvious reason why. The drivers' own *.sh drive a kernel build and a module reload on the
          # appliance over ssh, where a parse error costs a serial-console round trip to find.
          #
          # Every hook - early, start, stop, upgrade - and every script under src/opnsense/scripts:
          # recover.sh, bringup.sh, npu-run.sh, mgmt-link.sh and their like run as root on an
          # appliance too. And each file's result counts: `sh -n "$f" && echo` under bash -e failed
          # the step only when the last file failed, so any other broken file passed (until
          # 2026-11-06, with 37 of these files never read at all).
          rc=0
          for f in install/*.sh pkg/*.sh contrib/npuep/*.sh contrib/octep/*.sh src/etc/rc.syshook.d/*/* \
                   src/opnsense/scripts/**/*.sh; do
            [ -f "$f" ] || continue
            head -n1 "$f" | grep -q '^#!' || continue
            if sh -n "$f"; then echo "ok $f"; else echo "FAILED $f"; rc=1; fi
          done
          exit $rc

      # A step named "C parses" ran gcc -fsyntax-only over the drivers here until 2026-11-06. It could
      # not fail (`| head -5 || true`), and without FreeBSD's headers every file stopped at its first
      # #include <sys/...>, so it parsed nothing. The drivers are built on an appliance, every warning
      # fatal (RELEASING.md), and CodeQL reads their C (codeql.yml).

      # snprintf answers with what it would have written, not what it wrote, so its return added to an
      # offset unchecked can carry the offset past the buffer and make the next call's length wrap: a
      # write past the end, in the kernel. CodeQL found four such texts on 2026-11-01. The drivers build
      # every text with NPU_APPEND (npuep.h) or check the return before adding it (octep), and this
      # refuses the old way back.
      - name: No snprintf return added unchecked
        run: |
          if grep -n -E '(\+=|-=)[[:space:]]*v?snprintf[[:space:]]*\(' contrib/*/*.c; then
            echo "an snprintf return added to an offset unchecked - use NPU_APPEND, or check it first"
            exit 1
          fi
          echo "none in contrib/"

      # Which vendor version left its software on the coprocessor, and how that one numbers its commands, is
      # one table for both families. Each driver is built from its own directory alone, so each
      # carries the file; two copies that drift apart would be two answers to one question.
      - name: The vendor versions are one table
        run: |
          cmp contrib/npuep/sfosnum.h contrib/octep/sfosnum.h && echo "sfosnum.h is the same in both drivers"

      # A file added under src/ and left out of the installer is only on the boxes it was copied to
      # by hand: the coprocessor's console logger was, for two days, on the lab's and no one else's.
      - name: Every file under src/ is installed and uninstalled
        run: python3 tools/check-install-lists.py

  reporter:
    name: problem reporter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The reporter against a made-up machine - its logs, config.xml and commands invented in a
      # temporary directory - and a relay that is a function: what is found, what is cleaned out
      # of it, what is sent, and what is held back. tools/test-reporter.py.
      - name: The reporter on the appliance
        run: python3 tools/test-reporter.py

      # The port check's reading of the XGS 136's coprocessor ports with a line of them short of its
      # interface: said, and the rest read, not an IndexError the reporter took in silence (the review
      # of 2026-11-06, D10). tools/test-portcheck.py.
      - name: Port check with a short line
        run: python3 tools/test-portcheck.py

      # kernel-follow.sh where the kernel's sources cannot be had: what it says of the next boot with a
      # module for another kernel installed and with none, and that it pins nothing then (#818). And
      # the stop hook while another run holds the follower's lock: the next boot sent to kernel.old
      # where the module is built for it, and said to be only then. And the upgrade hook with the new
      # kernel still staged: the follower cut off at its time limit, and a failed rebuild said to leave
      # the next boot on kernel.old where the module is built for it. And a rebuild with stand-in
      # sources, a step of its install failing: what bringup.sh would load on either kernel is a module
      # built for it or nothing, never one built for the other (the review of 2026-11-06, P15). And a
      # fall-back the follower armed itself marked as its own, and let go of with it once the module is
      # rebuilt. tools/test-kernel-follow.py.
      - name: Kernel follower without sources, and its install
        run: python3 tools/test-kernel-follow.py

      # uninstall.sh run whole in a made-up root, rm and rmdir refusing anything outside it: no module of
      # either driver left, the previous ones and their stamps included, and the fall-back to kernel.old
      # taken back only where the follower marked it as its own - not while os-kernelfollow holds a mark
      # of its own, nor once nextboot names another kernel. tools/test-uninstall.py.
      - name: The uninstall and the follower's fall-back
        run: python3 tools/test-uninstall.py

      # bringup.sh with the driver's answers made up: a coprocessor an earlier load of the driver
      # handshook with is said so at once and offered nothing, where it was waited out for a minute and
      # said not to answer; an ordinary one is offered after the warm-up, the rings armed first. And the
      # front ports: one NetAgent gives no address in three tries - a request that timed out, one it
      # refused, an answer of zeros - is said by its name with the reason and named on the last line,
      # where it was said by its place in a loop and counted with the rest; one that answers is bound
      # as before, its logical interface first and its tag after. tools/test-bringup.py.
      - name: The bring-up's handshake and its ports
        run: python3 tools/test-bringup.py

      # What is done when the fast path stops answering its heartbeat: nothing by default, a restart
      # after the minutes the setting names, never more than three a day. tools/test-fastpath.py.
      - name: The fast path's watcher
        run: python3 tools/test-fastpath.py

      # recover.sh on both families with stand-ins for the driver, the coprocessor and OPNsense: a reload
      # of the interfaces that did not finish is a recovery not done, where it was counted done on the
      # heartbeat alone; and on the XGS 3300 a detach the driver refuses for a moment is asked again, six
      # times, where its first refusal restarted the appliance (the review of 2026-11-06, O8 and O9).
      # tools/test-recover.py.
      - name: The recovery in place, to its end
        run: python3 tools/test-recover.py

      # Which connections a block list cuts is decided from pf's own text: a state matched wrongly
      # is a connection cut for nothing, one missed stays open to a listed address.
      - name: The block lists' cut
        run: python3 tools/test-lists-cut.py

      # The same for a TLS fingerprint: which log lines name a listed one, and which states are theirs.
      - name: The TLS fingerprints' cut
        run: python3 tools/test-ja4-cut.py

      # And which connections in hardware either cut drops on the coprocessor first, from each
      # driver's own table: a connection matched wrongly is one dropped for nothing.
      - name: The cut in hardware
        run: python3 tools/test-hwdrop.py

      # And what is unusual: the states read once per connection, a scan and a sweep, a host far
      # beyond its own mean and not before it has history or below a floor.
      - name: Unusual traffic
        run: python3 tools/test-anomaly.py

      # The XGS 136's rows on the IPsec page, from the driver's list and setkey -D: an association in
      # UDP (NAT-T), its ports in brackets after its addresses, is a row like any other.
      # tools/test-ipsec.py.
      - name: The IPsec page's associations
        run: python3 tools/test-ipsec.py

      # The offload gate and a counter read through the XGS 3300 driver's one set of rpc sysctls, each
      # under the same lock: the gate's own command is the one posted for it, and the read's after it
      # (flock stands in for lockf). tools/test-rpc-lock.py.
      - name: One rpc command at a time
        run: python3 tools/test-rpc-lock.py

      # What XGS: Updates offers and what an update does with it, GitHub stood in for: an update
      # checks again and stops on a failed check; a build that diverged is not taken back to an
      # older release (issue 677). And end to end, codeload stood in for: a reboot asked for when one
      # module of two changed, a download tried three times and no more, nothing a failed update made
      # left behind and nothing it did not make taken away, and the releases read past the first
      # twenty, a page at a time, to the installed one.
      - name: The updater
        run: python3 tools/test-update.py

      # Every model's front ports, from scripts/xgs/models.py, against npuep.c's tables and the
      # XGS 3300's and XGS 136's panels that bringup.sh, portmap.py and assign.php fall back to; the
      # names portstats.py, coprocessor.py and temperatures.sh give the ports, from the same table;
      # and what the site's model pages say each port is on, tools/device_facts.py as
      # tools/devices-table.py writes it and website/data/devices.json has it.
      - name: Models and their ports
        run: python3 tools/test-models.py

      # The boot temperatures.sh keeps the XGS 3300's flags and its memory sensor's answer for, a token
      # in /var/run: a flag not as a healthy board has it is said once a boot, and a clock stepped
      # within the boot does not say it again. tools/test-temperatures.py.
      - name: The coprocessor's flags once a boot
        run: python3 tools/test-temperatures.py

      - name: Early NPU reset assembly guard (no hardware access)
        run: python3 tools/test-npuctl-guard.py

      # Which MCP2210 commands mcp2210.py sends, the bridge replaced by a recorder: a read is a read,
      # and nothing sets the pins' direction as if it were reading them.
      - name: The reset bridge's commands (no hardware access)
        run: python3 tools/test-mcp2210-commands.py

      # Every command the scripts read as text is decoded with errors='replace': one byte that is not
      # UTF-8 - a coprocessor's console gives them - raised past every handler and stopped the script.
      - name: Command output decoded without stopping on a bad byte
        run: python3 tools/test-decodes.py

      # The coprocessor's watchdog feeder as scripts/xgs/feeder.py reads it, continues it and starts
      # it again, with the coprocessor's answers made up (#768). And npu-run.sh's console session in a
      # copy with stand-ins: the console's logger let back in on every way out of it, and the session
      # ended once its command has answered (the review of 2026-11-06, D2).
      - name: The coprocessor's watchdog feeder
        run: python3 tools/test-feeder.py

      # mgmt-link.sh coprocessor with npu-run.sh, ping and the rest made up: the address goes through
      # npu-run.sh under the console's lock, is told again while the link does not answer, and stops
      # after about five minutes (#1010); trust waits as long as the address for that lock. And
      # mgmt-link.sh early, the ARMADA's link assigned at a boot that has it and no assignment, before
      # OPNsense configures its interfaces, and nothing done at the boot after, without the link, on
      # the XGS 3300, or on an answer it cannot read (the review's A4).
      - name: The management link's address
        run: python3 tools/test-mgmt-link.py

      # bridge-pathcost.sh against a made-up kernel's bridges, run after run: a 2.5G port's medium
      # as FreeBSD names it, a cost the old STP keeps in sixteen bits asked for once and not every
      # minute, and a cost an owner set left as it was set. tools/test-bridge-pathcost.py.
      - name: The bridged front ports' path costs
        run: python3 tools/test-bridge-pathcost.py

      # npuhs.py's endpoint by the id its driver probes for, wherever it sits on the bus, and nothing
      # read when it is not there. tools/test-npuhs.py.
      - name: The handshake reader's endpoint
        run: python3 tools/test-npuhs.py

      # reload.sh's and recover.sh's endpoint the same way: by its id in either form pciconf prints, not
      # the first Marvell device listed. tools/test-endpoint-select.py.
      - name: The endpoint reload and recovery take
        run: python3 tools/test-endpoint-select.py

      # The XGS 136's offload gate after its coprocessor is reset under the running host (recover.sh,
      # reload.sh), the boot hook and offload.sh themselves run: written once the rpc channel opens,
      # waited for as long as the driver waits for it, and the word accepted before the reset no longer
      # shown as the coprocessor's. tools/test-offload-gate.py.
      - name: Offload gate after a coprocessor reset
        run: python3 tools/test-offload-gate.py

      # Interfaces whose subnets overlap, and which of them answers nothing from the shared part:
      # scripts/xgs/subnets.py against the cases issue 911 met.
      - name: Interfaces sharing a subnet
        run: python3 tools/test-subnets.py

      # A plugin's update check that fails is the check's answer, not the plugin's last update:
      # scripts/xgs/plugins.py against a made-up plugin. One check at a time, and the page's started in
      # the background (the review of 2026-11-06, G10).
      - name: The plugins' update check
        run: python3 tools/test-plugins.py

      # The model an issue's form names, as its label: tools/labels.py.
      - name: The issues' model labels
        run: python3 tools/test-labels.py

      # One reminder, a week after a question, to the person asked, never twice: tools/reminder.py.
      - name: The reminder
        run: python3 tools/test-reminder.py

      # The cages read again when a link changes, not only every five minutes, and a read cut short
      # keeps the cages it did not reach as the read before had them: scripts/xgs/transceivers.py.
      - name: The cages read when a link changes
        run: python3 tools/test-transceivers.py

      # Who the thank-you bot thanks, for what, once, and who it never does: tools/thanks.py.
      - name: The thank-you bot
        run: python3 tools/test-thanks.py

      # Answered or not: `unanswered` while a person waits, `answered` once the developer has written,
      # one automated note after thirty minutes, and who never gets one: tools/answered.py.
      - name: Answered, unanswered and the automated note
        run: python3 tools/test-answered.py

      # Which issues a release tells that their fix is out, once, and which it does not:
      # tools/release-notice.py.
      - name: The release's notices
        run: python3 tools/test-release-notice.py

      # What a release's section takes from the commits and leaves out, the lines --release names to
      # read again, the commit a version's tag goes on, and release.yml that tags it: tools/changelog.py.
      - name: Changelog and release tag
        run: python3 tools/test-changelog.py

      # install/verify.sh on a made-up XGS 3300: its summary blames the front ports only when the chain
      # to them fails (issue 957). And what it says of the installation - the release installed, the
      # last update, the installer's files against their digests (issue 911). tools/test-verify.py.
      - name: The verify summary
        run: python3 tools/test-verify.py

      # A look that cannot read the coprocessor says so and keeps the reading before it, for the
      # next look and for a problem report's vendor build. And a read in sessions of 20 s at most, the
      # page's started in the background and answered at once, one at a time (the review of
      # 2026-11-06, D2 and G10). tools/test-coprocessor-state.py.
      - name: The coprocessor's last good reading kept
        run: python3 tools/test-coprocessor-state.py

      # Which device becomes MGMT at the first boot, after an install and after a factory reset (issue
      # 957): scripts/xgs/assign.php's own function, with PHP and no OPNsense. tools/test-assign-mgmt.py.
      - name: MGMT after a factory reset
        run: |
          command -v php > /dev/null || sudo apt-get install -y --no-install-recommends php-cli > /dev/null
          python3 tools/test-assign-mgmt.py

      # The first boot's question: countdown.py on a pseudo-terminal, and 30-xgs-assign's answer to
      # each outcome - a countdown that failed is asked again, not marked as a key. tools/test-countdown.py.
      - name: The first boot's countdown and its answers
        run: python3 tools/test-countdown.py

      # The firewall hook against the rule methods of every OPNsense it runs on: 26.7, the images'
      # own, has only registerForwardRule(), and calling the name 26.7.3 brought in stopped the boot
      # (issue 969); 27.1 drops the old name. tools/test-firewall-hook.py.
      - name: The firewall hook on every OPNsense
        run: |
          command -v php > /dev/null || sudo apt-get install -y --no-install-recommends php-cli > /dev/null
          python3 tools/test-firewall-hook.py

      # "Never offloaded" as scripts/xgs/flow_exclude.php reads it: a list longer than the 64 entries
      # the drivers keep is everything kept with the host, not refused. tools/test-flow-exclude.py.
      - name: Never offloaded past the driver's 64
        run: |
          command -v php > /dev/null || sudo apt-get install -y --no-install-recommends php-cli > /dev/null
          python3 tools/test-flow-exclude.py

      # Every model as the README and the site's home page show it, written from models.py.
      - name: The device tables are current
        run: python3 tools/devices-table.py --check

      # When a plugin's next release is due, and what its version and changelog block become:
      # tools/plugin-release-pr.py, which every plugin's release-pr.yml runs.
      - name: The plugins' release pull requests
        run: python3 tools/test-plugin-release-pr.py

      # The relay against a stand-in GitHub and an in-memory store, with a key made for the run:
      # the App's signature, an issue for a new fingerprint, a comment for a repeat, the allowance.
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: The relay
        run: node relay/test.mjs

      # The build page's routes of the site's Worker against a stand-in GitHub, Turnstile and store:
      # build.yml's choices only, three a day for each visitor and no address kept, a cancel only
      # with the key the page was given, the image handed over as GitHub's signed address.
      - name: The build page's Worker routes
        run: node website/worker/test-build.mjs

      # An owner's board and version as the compatibility page keeps them, from the answers GitHub
      # wrote into the reports (#1041). tools/test-compat-fields.py.
      - name: The compatibility page's board and version
        run: python3 tools/test-compat-fields.py

      # switch-jumbo.sh against a stand-in switch: an error line of the switch tool is no value - until
      # 2026-11-06 it stopped the script, unlogged, and left an earlier boot's "confirmed" as the state.
      # tools/test-switch-jumbo.py.
      - name: The switch ports' frame limit
        run: python3 tools/test-switch-jumbo.py

      # Both watchdogs stopped after the kernel follower's rebuild at shutdown, not before it; each boot
      # written down for the reporter before the coprocessor's reset and its driver's load, and one whose
      # look at boot never ran kept for the next; the ARMADA's management link assigned by an early hook
      # after the driver's, on the ARMADA alone (the review's A4); the reset's record moved to the boot's
      # time before the reporter runs; the coprocessor's clock not set at boot said once; the appliance's
      # own settings set again after a factory reset. tools/test-hooks.py.
      - name: The shutdown's order and five small hooks
        run: python3 tools/test-hooks.py

      # tunables-kenv.sh: the configuration's tunables put in the kernel's environment before the driver
      # loads, and those it no longer has taken out of it - not the owner's own (issue 669). With PHP, the
      # script's own PHP too. tools/test-tunables-kenv.py.
      - name: The driver's tunables at the boot after a restore
        run: |
          command -v php > /dev/null || sudo apt-get install -y --no-install-recommends php-cli > /dev/null
          python3 tools/test-tunables-kenv.py

      # reset_reason.py across a clock step between the hook that keeps the reset's cause and the reporter
      # that reports it: the reporter's own reset_reason() still finds it. tools/test-reset-reason.py.
      - name: The reset's cause across a clock step
        run: python3 tools/test-reset-reason.py

      # npu-clock.sh over a slow stand-in link: the coprocessor's clock set right, not behind by the
      # connection, and a set that does not hold logged once. tools/test-npu-clock.py.
      - name: The coprocessor's clock over a slow link
        run: python3 tools/test-npu-clock.py

      # apply.php's ipsec_soft_crypto on and off, with PHP and no OPNsense: off gives back what a boot
      # leaves (until 2026-11-06 it wrote nothing). And the rows of System: Settings: Tunables an apply
      # removes: the flow maker's own among them, which OPNsense set over the page's setting at every
      # boot until 2026-11-06 (the review's G5). tools/test-apply.py.
      - name: IPsec's software sessions, and the tunables an apply removes
        run: |
          command -v php > /dev/null || sudo apt-get install -y --no-install-recommends php-cli > /dev/null
          python3 tools/test-apply.py

  # contrib/mvsw/mvsw is the repository's one binary: the coprocessor's switch tool, built for aarch64,
  # which no appliance can build (contrib/mvsw/README.md). It is built again here from mvsw.c with its
  # own Makefile - freestanding, no build id, stripped, so the build is reproducible - in the Ubuntu
  # the committed one was made on, and must come out the same byte for byte: the binary is its source.
  mvsw:
    name: switch tool
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - uses: actions/checkout@v7

      - name: The switch tool is what its source builds
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends gcc-aarch64-linux-gnu make > /dev/null
          aarch64-linux-gnu-gcc --version | head -1
          cp contrib/mvsw/mvsw /tmp/mvsw.committed
          make -s -C contrib/mvsw clean mvsw
          cmp /tmp/mvsw.committed contrib/mvsw/mvsw
          echo "contrib/mvsw/mvsw is what contrib/mvsw/mvsw.c builds: $(sha256sum contrib/mvsw/mvsw | cut -c1-16)"

  privacy:
    name: nothing private
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # This repository documents one specific appliance in detail, so it carries more hardware
      # identifiers than most: base MAC addresses, an SMBIOS serial that contains the assembly
      # number, a bridge serial number, link-local addresses derived from a real MAC. Every one
      # of them has to be a placeholder before it is published.
      - name: No real addresses, hardware identifiers or credentials
        run: python3 tools/check-private-data.py .

      - name: No Arabic outside the translation files
        run: python3 tools/check-code-language.py .

      # And the other half: every string the coprocessor's pages show has its Arabic. A contributor's
      # pull request (from a fork) and main may carry a string whose Arabic follows later
      # (CONTRIBUTING.md): a warning there; on a branch of this repository a failure, as before.
      - name: Every page string translated
        env:
          ARABIC_LATER: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository) && '1' || '' }}
        run: python3 tools/check-gui-strings.py .

      # The same check on a made-up page and catalogue, both ways. tools/test-gui-strings.py.
      - name: Arabic later, and only where it is allowed
        run: python3 tools/test-gui-strings.py

      # An API action that saves config.xml itself refuses a user with user-config-readonly first, as
      # OPNsense's own model controllers do (the review of 2026-11-06, G11). tools/test-readonly-saves.py.
      - name: No save past the read-only check
        run: python3 tools/test-readonly-saves.py

      # Every source file names its copyright holder. A licence is permission and not ownership,
      # and a file with a licence line and no holder names nobody. The script adds the line in
      # the file's own comment style; here it only reports, and a missing line fails the check.
      - name: Every source file carries the copyright line
        run: python3 tools/add-copyright.py

      # The datapath carries four numbers that are not independent - the private header length,
      # the instruction front size, the PKI skip length and the checksum offset - and two of them
      # are derived from the other two. They were wrong for weeks because one was assumed to be
      # zero and nothing compared the header against the pages that quote it. Being wrong that
      # way is silent: frames post, counters rise, and the far side discards everything.
      - name: Datapath constants agree with the documents
        run: python3 tools/check-datapath-constants.py

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # A document here argues from the tree: it names a file, a sysctl, a constant, and expects
      # the reader to go and look. A name that no longer resolves leaves the prose readable and
      # wrong, which is the failure that takes longest to notice.
      - name: What the documents point at still exists
        run: python3 tools/check-doc-references.py .

      # Every document here is reachable from README.md or DESIGN.md, and a link that points at
      # a file that was renamed is the usual way a set of notes rots. Images and diagrams are
      # links too: the pages were moved into folders on 2026-10-11 and this is what said the
      # move was whole.
      - name: Internal links and images resolve
        run: python3 tools/check-doc-links.py

      # Every page opens with the day it was last read, and docs/INDEX.md lists them all with it.
      # The catalogue is written from the pages alone, so a page added, or a date moved, without
      # running tools/docs-index.py shows up here - not a month later as a page nobody schedules.
      - name: The catalogue lists every page as it stands
        run: python3 tools/docs-index.py --check

      # Each appliance's completion is weighed by its family page's table, and the README's status
      # board draws it from there at every build of npuforge.org. A page that states a completion -
      # the table's own "Weighted" line, armada.md's header, parity.md - and states another one than
      # the table weighs shows up here, so a row re-weighed carries its total with it.
      - name: Every stated completion is the one its table weighs
        run: python3 tools/readme-art.py --check

      # docs/images/README.md lists every image by kind with what it shows and where it is used,
      # and the wiki takes its images from there. Written from the tree like the catalogue above,
      # so an image added, moved or left without a page shows up here.
      - name: The image index lists every image as it stands
        run: python3 tools/images-index.py --check

      # Every photograph and screenshot carries its owner and licence (CC BY 4.0), in a strip below it
      # and in its metadata: an image added without running tools/mark-images.py shows up here.
      - name: Every image carries its owner and licence
        run: python3 tools/mark-images.py --check
