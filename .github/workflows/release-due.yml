name: release due

# Say when a release is due, by the rules in RELEASING.md: at once when a fix waits, and for
# improvements once ten wait or the oldest has waited thirty days. Daily, it keeps ONE issue open -
# "A release is due" - listing what waits, and closes it once a release has taken it. It never
# releases anything itself: a release is a pull request that adds a version to CHANGELOG.md.

on:
  schedule:
    - cron: '41 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  due:
    name: is a release due
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: What waits since the last release
        id: due
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          if python3 tools/changelog.py --due 30 10 > due.md; then
            echo "due=no" >> "$GITHUB_OUTPUT"
          else
            echo "due=yes" >> "$GITHUB_OUTPUT"
          fi
          cat due.md

      - name: One issue, kept current
        env:
          GH_TOKEN: ${{ github.token }}
          DUE: ${{ steps.due.outputs.due }}
        run: |
          set -eu
          title="A release is due"
          # Its own issue alone: one opened by this repository's workflows (the Actions app), with this
          # title exactly. Until 2026-11-06 any open issue whose title held these words was taken - one
          # a person opened would have been edited or closed - and a lookup that failed opened another.
          existing=$(TITLE="${title}" gh issue list --state open --author app/github-actions --search "in:title \"${title}\"" --json number,title --jq 'map(select(.title == env.TITLE)) | .[0].number // empty')
          if [ "${DUE}" != "yes" ]; then
            if [ -n "${existing}" ]; then
              gh issue close "${existing}" --comment "Nothing waits for a release on $(date -u +%F)."
            fi
            exit 0
          fi
          {
            echo "By the rules in [RELEASING.md](../blob/main/RELEASING.md), a release is due as of $(date -u +%F)."
            echo
            cat due.md
            echo
            echo "To release: \`python3 tools/changelog.py --release <version>\` on a branch, and a pull request titled \`Release <version>\` with CHANGELOG.md alone."
          } > body.md
          if [ -n "${existing}" ]; then
            gh issue edit "${existing}" --body-file body.md
          else
            gh issue create --title "${title}" --body-file body.md
          fi
