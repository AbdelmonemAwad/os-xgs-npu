name: release

# Make a release when - and only when - CHANGELOG.md gains a version that has no tag yet.
#
# A release is what every appliance's Updates page offers, so it is never made by a push: it is made
# by merging a pull request that adds a version section to CHANGELOG.md (tools/changelog.py --release).
# This finds the newest version there, and if no tag carries it, tags the merge commit and makes the
# release - that section its notes, named by its number alone - a DRAFT. The owner's private signing
# repository then signs it: its three files (RELEASING.md, step 5) added to the draft, and the release
# published and marked the latest - the number says alpha; a pre-release would leave the repository's
# page showing only tags. Published first and signed after, as until 2026-11-07, it could not be
# signed at all: this repository's releases are immutable, and a published one takes no file more
# ("Cannot upload assets to an immutable release", 2026-11-07 00:38 UTC, v0.1.0-alpha.14); and an
# appliance whose update.py checks the signature offers no release before its files are up. A release
# whose signing fails stays a draft, which no appliance and no visitor sees. What follows a release -
# the site, the issues it fixes, "A release is due", the ready-made images - is released.yml's, on the
# release's publication. RELEASING.md has when a release is made and how the number is chosen.

on:
  push:
    branches: [ main ]
    paths: [ CHANGELOG.md ]
  # By hand: as a push does, or - given `sign` - only the signing of that tag's release started again,
  # nothing tagged and nothing made: for a release whose start failed, and to try the start itself. The
  # signing repository signs a draft and publishes it, and of a release published and signed already it
  # says so and does nothing (2026-11-07: v0.1.0-alpha.15's start failed - the token could not see the
  # signing repository - and nothing on GitHub showed it).
  workflow_dispatch:
    inputs:
      sign:
        description: "a release's tag, as v0.1.0-alpha.15: only its signing started (empty: as a push)"
        required: false
        default: ''

permissions:
  contents: read

# One run at a time: a push and a run by hand side by side could both find the version untagged. A run
# that waits is replaced by a newer one, which reads the same changelog and tags the same commit (below).
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: tag a new version, its release a draft to sign
    # From main alone. A run by hand on another branch would have published that branch's changelog,
    # tagged at its head (until 2026-11-06).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: A version the changelog has and the tags do not
        id: version
        env:
          SIGN: ${{ inputs.sign }}
        run: |
          set -eu
          v=$(python3 tools/changelog.py --top)
          if [ -n "${SIGN:-}" ]; then
            echo "run by hand to start the signing of ${SIGN} alone - nothing tagged or made"
            echo "version=" >> "$GITHUB_OUTPUT"
          elif [ -z "${v}" ]; then
            echo "CHANGELOG.md has no released version"
            echo "version=" >> "$GITHUB_OUTPUT"
          elif git rev-parse -q --verify "refs/tags/v${v}" > /dev/null; then
            echo "v${v} is tagged already - nothing to make"
            echo "version=" >> "$GITHUB_OUTPUT"
          else
            echo "v${v} is new"
            echo "version=${v}" >> "$GITHUB_OUTPUT"
          fi

      # The tag goes on the commit that added the version's section: the merge of the release's pull
      # request, which is this run's own commit when that merge started it. Until 2026-11-06 it went on
      # the commit the run started from, so a run by hand after other merges would have tagged those too,
      # though no section names them and none of their issues is told. No such commit: nothing tagged.
      # The tag is pushed before the draft is made: the signing reads the tag's commit as GitHub names it.
      - name: Tag the merge commit and make its release a draft
        if: steps.version.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          target=$(python3 tools/changelog.py --commit "${VERSION}")
          python3 tools/changelog.py --notes "${VERSION}" > notes.md
          git tag "v${VERSION}" "${target}"
          git push origin "refs/tags/v${VERSION}"
          gh release create "v${VERSION}" --verify-tag --draft --title "${VERSION}" --notes-file notes.md
          echo "v${VERSION} tagged at ${target}; its release a draft, to be signed and published"

      # The signing repository is another one, private, whose workflow this run's own token cannot
      # start: SIGNING_DISPATCH_TOKEN is a fine-grained token with Actions read and write on it alone.
      # Without it, that repository's own look every six hours finds the draft. A start that fails
      # fails the run, where to anyone looking it shows: until 2026-11-07 it was let pass
      # (continue-on-error), the run said success, and v0.1.0-alpha.15 waited unsigned with nothing to
      # show why but its log. The branch is named, so nothing is asked of the repository but the start.
      - name: Start the signing of the release
        if: steps.version.outputs.version != '' || inputs.sign != ''
        env:
          GH_TOKEN: ${{ secrets.SIGNING_DISPATCH_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          SIGN: ${{ inputs.sign }}
        run: |
          set -eu
          TAG=${SIGN:-v${VERSION}}
          if [ -z "${GH_TOKEN}" ]; then
            echo "::warning::no SIGNING_DISPATCH_TOKEN: os-xgs-npu-release-signing signs and publishes ${TAG} at its next look, within six hours"
            exit 0
          fi
          if ! gh workflow run sign.yml -R AbdelmonemAwad/os-xgs-npu-release-signing --ref main \
              -f repository=os-xgs-npu -f tag="${TAG}"; then
            echo "::error::the signing of ${TAG} was not started: SIGNING_DISPATCH_TOKEN cannot start sign.yml in os-xgs-npu-release-signing - it must be a token with that repository alone and Actions: Read and write. ${TAG} stays a draft until the signing repository's look, within six hours."
            exit 1
          fi
          echo "os-xgs-npu-release-signing is signing ${TAG}; it publishes the release once its files are up"
