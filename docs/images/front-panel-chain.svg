<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 300" width="940" height="300" font-family="DejaVu Sans, Verdana, sans-serif">
  <rect x="0" y="0" width="940" height="300" fill="#ffffff"/>

  <text x="20" y="30" font-size="17" font-weight="bold" fill="#111">The front panel, end to end</text>
  <text x="20" y="52" font-size="12.5" fill="#555">Solid lines are measured on this appliance. Dashed lines are the EZIO design and have not been exercised here.</text>

  <!-- host UART -->
  <rect x="20" y="86" width="168" height="76" rx="7" fill="#eef3fb" stroke="#4a6fa5" stroke-width="1.6"/>
  <text x="104" y="110" font-size="13" font-weight="bold" fill="#1d3557" text-anchor="middle">host uart1</text>
  <text x="104" y="129" font-size="11.5" fill="#1d3557" text-anchor="middle">0x2f8 · IRQ 4</text>
  <text x="104" y="147" font-size="11.5" fill="#1d3557" text-anchor="middle">/dev/cuau1</text>

  <!-- arrow 1 -->
  <line x1="188" y1="118" x2="252" y2="118" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <text x="220" y="108" font-size="11" fill="#333" text-anchor="middle">2400 8N1</text>

  <!-- ribbon header -->
  <rect x="252" y="86" width="140" height="76" rx="7" fill="#f6f6f2" stroke="#777" stroke-width="1.6"/>
  <text x="322" y="112" font-size="12.5" font-weight="bold" fill="#333" text-anchor="middle">DISPLAY_CONN1</text>
  <text x="322" y="132" font-size="11.5" fill="#555" text-anchor="middle">ribbon to the</text>
  <text x="322" y="148" font-size="11.5" fill="#555" text-anchor="middle">front panel board</text>

  <!-- arrow 2 -->
  <line x1="392" y1="118" x2="452" y2="118" stroke="#333" stroke-width="2" marker-end="url(#a)"/>

  <!-- the bridge -->
  <rect x="452" y="78" width="186" height="92" rx="7" fill="#fdf1e3" stroke="#b5752a" stroke-width="1.8"/>
  <text x="545" y="102" font-size="13" font-weight="bold" fill="#7a4a12" text-anchor="middle">GIFAR GMRU20X4</text>
  <text x="545" y="121" font-size="11.5" fill="#7a4a12" text-anchor="middle">28 pins, its own crystal Y1</text>
  <text x="545" y="139" font-size="11.5" fill="#7a4a12" text-anchor="middle">serial to HD44780 bridge</text>
  <text x="545" y="157" font-size="11.5" font-style="italic" fill="#7a4a12" text-anchor="middle">this is what answers, not the LCD</text>

  <!-- arrow 3 -->
  <line x1="638" y1="118" x2="700" y2="118" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <text x="669" y="108" font-size="11" fill="#333" text-anchor="middle">parallel</text>

  <!-- the LCD drawn as a screen -->
  <rect x="700" y="82" width="218" height="84" rx="6" fill="#dfe9f5" stroke="#4a6fa5" stroke-width="1.8"/>
  <rect x="712" y="96" width="194" height="40" rx="3" fill="#2f5fa8" stroke="#1d3557" stroke-width="1"/>
  <text x="809" y="112" font-size="11.5" fill="#eaf1fb" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">OPNsense</text>
  <text x="809" y="129" font-size="11.5" fill="#eaf1fb" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">line two</text>
  <text x="809" y="156" font-size="11.5" fill="#1d3557" text-anchor="middle">16x2 character LCD</text>

  <!-- buttons, dashed back to the bridge -->
  <rect x="452" y="206" width="186" height="60" rx="7" fill="#f3f3f3" stroke="#999" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="545" y="230" font-size="12.5" fill="#444" text-anchor="middle">the four front buttons</text>
  <text x="545" y="249" font-size="11" fill="#777" text-anchor="middle">polled over the same serial link</text>
  <line x1="545" y1="206" x2="545" y2="172" stroke="#999" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#b)"/>

  <!-- status back to the host -->
  <path d="M452 160 L420 160 L420 196 L104 196 L104 164" fill="none" stroke="#999" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#b)"/>
  <text x="262" y="192" font-size="11" fill="#777" text-anchor="middle">status and key presses read back</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#333"/>
    </marker>
    <marker id="b" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#999"/>
    </marker>
  </defs>
</svg>
