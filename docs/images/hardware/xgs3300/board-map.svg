<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="960" height="660" font-family="DejaVu Sans, Verdana, sans-serif">
  <rect x="0" y="0" width="960" height="660" fill="#ffffff"/>

  <text x="20" y="30" font-size="17" font-weight="bold" fill="#111">The XGS 3300, part by part</text>
  <text x="20" y="52" font-size="12.5" fill="#555">Solid boxes and lines are read from software on this appliance or from the vendor's board file.</text>
  <text x="20" y="69" font-size="12.5" fill="#555">Dashed ones rest on a part's marking or the photograph alone.</text>

  <!-- host -->
  <rect x="20" y="96" width="235" height="150" rx="7" fill="#eef3fb" stroke="#4a6fa5" stroke-width="1.6"/>
  <text x="30" y="118" font-size="13" font-weight="bold" fill="#222">AMD Ryzen V1780B, the host</text>
  <text x="30" y="136" font-size="11.5" fill="#333">8 threads, 16 GB; OPNsense on it</text>
  <text x="30" y="158" font-size="11.5" fill="#333">uart0 0x3f8: its console</text>
  <text x="30" y="175" font-size="11.5" fill="#333">uart1 0x2f8: the front panel</text>
  <text x="30" y="192" font-size="11.5" fill="#333">uart2 0x3e8: coprocessor console</text>
  <text x="30" y="216" font-size="11.5" fill="#333">M.2 drive, marked EDILOC EN206</text>
  <text x="30" y="233" font-size="11" fill="#777">its name is from the photograph</text>

  <!-- i210 -->
  <rect x="20" y="272" width="235" height="72" rx="7" fill="#eef3fb" stroke="#4a6fa5" stroke-width="1.6"/>
  <text x="30" y="294" font-size="13" font-weight="bold" fill="#222">Intel i210-AT, WGI210AT</text>
  <text x="30" y="313" font-size="11.5" fill="#333">8086:157b at pci0:2:0:0, igb0</text>
  <text x="30" y="330" font-size="11.5" fill="#333">the management port</text>

  <!-- MCP2210 -->
  <rect x="20" y="370" width="235" height="72" rx="7" fill="#eef3fb" stroke="#4a6fa5" stroke-width="1.6"/>
  <text x="30" y="392" font-size="13" font-weight="bold" fill="#222">MCP2210 USB-to-SPI bridge</text>
  <text x="30" y="411" font-size="11.5" fill="#333">fitted; all nine pins are inputs</text>
  <text x="30" y="428" font-size="11.5" fill="#333">it does not hold this coprocessor</text>

  <!-- PCIe -->
  <line x1="255" y1="166" x2="345" y2="166" stroke="#4a6fa5" stroke-width="2"/>
  <text x="300" y="156" font-size="11" fill="#4a6fa5" text-anchor="middle">PCIe 177d:a300</text>
  <text x="300" y="181" font-size="11" fill="#4a6fa5" text-anchor="middle">8 VFs; SDP rings</text>

  <!-- coprocessor -->
  <rect x="345" y="96" width="290" height="210" rx="7" fill="#eef7ee" stroke="#3f8f4f" stroke-width="1.6"/>
  <text x="355" y="118" font-size="13" font-weight="bold" fill="#222">Cavium OCTEON TX CN8365, at U11</text>
  <text x="355" y="136" font-size="11.5" fill="#333">20 cores, 17 of them fast-path workers</text>
  <text x="355" y="153" font-size="11.5" fill="#333">its own Linux; console on the host's uart2</text>
  <text x="355" y="177" font-size="11.5" fill="#333">SPI NOR w25q128: firmware, misc config,</text>
  <text x="355" y="194" font-size="11.5" fill="#333">U-Boot environment at 0xf00000</text>
  <text x="355" y="218" font-size="11.5" fill="#333">eMMC 7.28 GB: two root slots of 1.5 GB,</text>
  <text x="355" y="235" font-size="11.5" fill="#333">500 MB and 90 MB beside them</text>
  <text x="355" y="259" font-size="11.5" fill="#333">BGX2 to the 10G PHY; MDIO to the switch</text>
  <text x="355" y="286" font-size="11" fill="#777">the storage read on the coprocessor, 2026-09-29</text>

  <!-- switch -->
  <rect x="690" y="96" width="250" height="96" rx="7" fill="#fdf3e7" stroke="#b7791f" stroke-width="1.6"/>
  <text x="700" y="118" font-size="13" font-weight="bold" fill="#222">Marvell 88E6193X, the switch</text>
  <text x="700" y="138" font-size="11.5" fill="#333">Port1 to Port8, copper</text>
  <text x="700" y="155" font-size="11.5" fill="#333">PortF3, PortF4: the two 1G SFP cages</text>
  <text x="700" y="172" font-size="11.5" fill="#333">one uplink to the coprocessor</text>
  <line x1="635" y1="144" x2="690" y2="144" stroke="#3f8f4f" stroke-width="2"/>
  <text x="662" y="134" font-size="11" fill="#3f8f4f" text-anchor="middle">MDIO</text>

  <!-- PHY -->
  <rect x="690" y="216" width="250" height="78" rx="7" fill="#fdf3e7" stroke="#b7791f" stroke-width="1.6"/>
  <text x="700" y="238" font-size="13" font-weight="bold" fill="#222">Marvell 88X5113-BVM4, at U42</text>
  <text x="700" y="258" font-size="11.5" fill="#333">PortF1, PortF2 at 10G, mdio45:0:7</text>
  <text x="700" y="275" font-size="11.5" fill="#333">direct to BGX2, not via the switch</text>
  <line x1="635" y1="255" x2="690" y2="255" stroke="#3f8f4f" stroke-width="2"/>
  <text x="662" y="245" font-size="11" fill="#3f8f4f" text-anchor="middle">BGX2</text>

  <!-- front panel -->
  <rect x="345" y="336" width="290" height="80" rx="7" fill="#fdf1e3" stroke="#b5752a" stroke-width="1.6"/>
  <text x="355" y="358" font-size="13" font-weight="bold" fill="#222">the front panel</text>
  <text x="355" y="378" font-size="11.5" fill="#333">EZIO bridge: a GIFAR GMRU20X4, its own</text>
  <text x="355" y="395" font-size="11.5" fill="#333">micro-controller; a 20x2 HD44780 display</text>
  <text x="355" y="411" font-size="11" fill="#777">9600 8N1 from uart1; four buttons</text>
  <path d="M 255 206 L 300 206 L 300 376 L 345 376" fill="none" stroke="#4a6fa5" stroke-width="1.6"/>
  <text x="294" y="292" font-size="11" fill="#4a6fa5" transform="rotate(-90 294 292)" text-anchor="middle">uart1, a ribbon to the panel</text>

  <!-- service headers -->
  <rect x="690" y="336" width="250" height="80" rx="7" fill="#ffffff" stroke="#999" stroke-width="1.6" stroke-dasharray="6,4"/>
  <text x="700" y="358" font-size="13" font-weight="bold" fill="#222">service headers</text>
  <text x="700" y="378" font-size="11.5" fill="#333">JUART1 at RS-232 levels (SP3232),</text>
  <text x="700" y="395" font-size="11.5" fill="#333">JSPI1, JSPI2, JTAG1, JTAG2, JSW1-4</text>
  <text x="700" y="411" font-size="11" fill="#777">which UART JUART1 carries is not known</text>

  <!-- CPLD -->
  <rect x="345" y="446" width="290" height="110" rx="7" fill="#eef7ee" stroke="#3f8f4f" stroke-width="1.6"/>
  <text x="355" y="468" font-size="13" font-weight="bold" fill="#222">Lattice LCMXO3LF-2100C, "the CPLD"</text>
  <text x="355" y="488" font-size="11.5" fill="#333">on the coprocessor's SPI, spi:0:1:3</text>
  <text x="355" y="505" font-size="11.5" fill="#333">32-bit registers: 0x25 the cages' pins,</text>
  <text x="355" y="522" font-size="11.5" fill="#333">0x38 SFF events, 0x39 to 0x3b the relays</text>
  <text x="355" y="543" font-size="11" fill="#777">read and cleared, never otherwise written</text>
  <line x1="490" y1="306" x2="490" y2="336" stroke="#3f8f4f" stroke-width="2"/>
  <line x1="490" y1="416" x2="490" y2="446" stroke="#3f8f4f" stroke-width="2"/>
  <text x="498" y="326" font-size="11" fill="#3f8f4f">SPI, mode 3, 3 MHz, to the CPLD below</text>

  <!-- relays -->
  <rect x="690" y="446" width="250" height="72" rx="7" fill="#ffffff" stroke="#b7791f" stroke-width="1.6" stroke-dasharray="6,4"/>
  <text x="700" y="468" font-size="13" font-weight="bold" fill="#222">nine relays, RELAY1 to RELAY9</text>
  <text x="700" y="488" font-size="11.5" fill="#333">NEXEM UD2-3SNUN, two-form-C</text>
  <text x="700" y="505" font-size="11.5" fill="#333">the bypass pairs behind 0x39 to 0x3b</text>
  <line x1="635" y1="482" x2="690" y2="482" stroke="#3f8f4f" stroke-width="2"/>

  <!-- footer -->
  <text x="20" y="592" font-size="12" fill="#555">Twelve front ports: ten behind the switch, two on the PHY. The cages' lasers and the relays are the CPLD's; the display is</text>
  <text x="20" y="609" font-size="12" fill="#555">the panel's own micro-controller's. The USB-SPI bridge that resets an ARMADA coprocessor is fitted here and holds nothing.</text>
  <text x="20" y="638" font-size="11" fill="#999">Sources: docs/families/octeon-tx-reference.md, octeon-tx-peripherals.md, the-road.md, npuep/npu-bring-up.md; the storage from the inventory's survey.</text>
</svg>
