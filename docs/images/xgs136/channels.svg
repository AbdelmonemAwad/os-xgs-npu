<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="DejaVu Sans, Verdana, sans-serif">
  <rect x="0" y="0" width="960" height="560" fill="#ffffff"/>

  <text x="20" y="30" font-size="17" font-weight="bold" fill="#111">What reaches the XGS 136's coprocessor, and from where</text>
  <text x="20" y="52" font-size="12.5" fill="#555">Solid lines are measured on this appliance. Dashed lines are in the vendor's platform files and have not been exercised here.</text>

  <!-- host -->
  <rect x="20" y="90" width="230" height="380" rx="7" fill="#eef3fb" stroke="#4a6fa5" stroke-width="1.6"/>
  <text x="135" y="112" font-size="13" font-weight="bold" fill="#222" text-anchor="middle">AMD Ryzen R1606G, the host</text>
  <text x="135" y="130" font-size="11.5" fill="#333" text-anchor="middle">4 CPUs, 8 GB, FreeBSD</text>
  <text x="30" y="172" font-size="11.5" fill="#1d3557">pci1: 11ab:7080</text>
  <text x="30" y="188" font-size="11" fill="#777">Gen3 x4, MSI-X 16</text>
  <text x="30" y="252" font-size="11.5" fill="#1d3557">host memory</text>
  <text x="30" y="268" font-size="11" fill="#777">two rings, polled</text>
  <text x="30" y="332" font-size="11.5" fill="#1d3557">xhci0: the internal USB</text>
  <text x="30" y="348" font-size="11" fill="#777">hidraw on usbhid0</text>
  <text x="30" y="412" font-size="11.5" fill="#1d3557">uart2 at 0x3e8, IRQ 3</text>
  <text x="30" y="428" font-size="11" fill="#777">needs a hint to appear</text>
  <text x="30" y="458" font-size="11.5" fill="#1d3557">intsmb0, the AMD FCH SMBus</text>

  <!-- coprocessor -->
  <rect x="690" y="90" width="250" height="380" rx="7" fill="#eef7ee" stroke="#3f8f4f" stroke-width="1.6"/>
  <text x="815" y="112" font-size="13" font-weight="bold" fill="#222" text-anchor="middle">Marvell CN9131, the coprocessor</text>
  <text x="815" y="130" font-size="11.5" fill="#333" text-anchor="middle">its own Linux, its own eMMC</text>
  <text x="700" y="172" font-size="11.5" fill="#1a4a1a">BAR0: GIU, NW AGENT</text>
  <text x="700" y="188" font-size="11" fill="#777">BAR2: ctrl, mgmt netdev, RPC, bar map</text>
  <text x="700" y="252" font-size="11.5" fill="#1a4a1a">mvmgmt0, a virtual Ethernet</text>
  <text x="700" y="268" font-size="11" fill="#777">reached through its outbound window</text>
  <text x="700" y="332" font-size="11.5" fill="#1a4a1a">the reset line</text>
  <text x="700" y="348" font-size="11" fill="#777">held at power-up; released by a pulse</text>
  <text x="700" y="412" font-size="11.5" fill="#1a4a1a">its console, 115200</text>
  <text x="700" y="428" font-size="11" fill="#777">U-Boot, then Linux 4.14</text>

  <!-- 1 PCIe -->
  <rect x="290" y="146" width="360" height="56" rx="6" fill="#ffffff" stroke="#4a6fa5" stroke-width="1.4"/>
  <text x="470" y="166" font-size="12" font-weight="bold" fill="#1d3557" text-anchor="middle">PCIe: the endpoint and its five facilities</text>
  <text x="470" y="184" font-size="11" fill="#555" text-anchor="middle">BAR0 1 MB; BAR2 16 MB, the facilities at its top; BAR4 16 MB</text>
  <line x1="250" y1="174" x2="290" y2="174" stroke="#333" stroke-width="2"/>
  <line x1="650" y1="174" x2="690" y2="174" stroke="#333" stroke-width="2" marker-end="url(#a)"/>

  <!-- 2 mvmgmt -->
  <rect x="290" y="226" width="360" height="56" rx="6" fill="#ffffff" stroke="#4a6fa5" stroke-width="1.4"/>
  <text x="470" y="246" font-size="12" font-weight="bold" fill="#1d3557" text-anchor="middle">mvmgmt0: the management link</text>
  <text x="470" y="264" font-size="11" fill="#555" text-anchor="middle">rings in host memory; both sides poll at 10 ms, no doorbell</text>
  <line x1="250" y1="254" x2="290" y2="254" stroke="#333" stroke-width="2"/>
  <line x1="650" y1="254" x2="690" y2="254" stroke="#333" stroke-width="2" marker-end="url(#a)"/>

  <!-- 3 MCP2210 -->
  <rect x="290" y="306" width="360" height="56" rx="6" fill="#ffffff" stroke="#4a6fa5" stroke-width="1.4"/>
  <text x="470" y="326" font-size="12" font-weight="bold" fill="#1d3557" text-anchor="middle">MCP2210 USB-to-SPI bridge, 04d8:00de</text>
  <text x="470" y="344" font-size="11" fill="#555" text-anchor="middle">GP0, GP3, GP5 (mask 0x0029): hold, a pause, release</text>
  <line x1="250" y1="334" x2="290" y2="334" stroke="#333" stroke-width="2"/>
  <line x1="650" y1="334" x2="690" y2="334" stroke="#333" stroke-width="2" marker-end="url(#a)"/>

  <!-- 4 uart2 -->
  <rect x="290" y="386" width="360" height="56" rx="6" fill="#ffffff" stroke="#4a6fa5" stroke-width="1.4"/>
  <text x="470" y="406" font-size="12" font-weight="bold" fill="#1d3557" text-anchor="middle">the coprocessor's console</text>
  <text x="470" y="424" font-size="11" fill="#555" text-anchor="middle">115200 raw, echo off, read in the background with a timeout</text>
  <line x1="690" y1="414" x2="650" y2="414" stroke="#333" stroke-width="2"/>
  <line x1="290" y1="414" x2="250" y2="414" stroke="#333" stroke-width="2" marker-end="url(#a)"/>

  <!-- 5 SMBus, dashed, to a side box -->
  <rect x="290" y="486" width="360" height="50" rx="6" fill="#ffffff" stroke="#999" stroke-width="1.4" stroke-dasharray="6,4"/>
  <text x="470" y="506" font-size="12" font-weight="bold" fill="#444" text-anchor="middle">the SFP cages F1, F2 and the PoE controller</text>
  <text x="470" y="524" font-size="11" fill="#777" text-anchor="middle">the vendor's platform tool reads the VPD EEPROM at 0x57</text>
  <path d="M 135 470 L 135 511 L 290 511" fill="none" stroke="#999" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#b)"/>

  <text x="20" y="552" font-size="11" fill="#999">Sources: docs/hardware/xgs136.md; docs/npuep/facility-protocol.md, mvmgmt.md, npu-bring-up.md.</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#333"/>
    </marker>
    <marker id="b" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#999"/>
    </marker>
  </defs>
</svg>
