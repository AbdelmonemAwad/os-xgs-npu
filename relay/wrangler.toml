#
# The problem-report relay, as Cloudflare deploys it: relay/README.md. No secret is written here -
# the App's id, installation and key are set with `wrangler secret put`.

name = "os-xgs-npu-report-relay"
main = "worker.js"
compatibility_date = "2026-10-01"

[vars]
GITHUB_OWNER = "AbdelmonemAwad"

# The store for fingerprints, allowances and contact addresses. `wrangler kv namespace create
# REPORTS` prints the id to put here.
[[kv_namespaces]]
binding = "REPORTS"
id = "put-the-namespace-id-here"

# The address the appliances post to (scripts/xgs/reporter.py, RELAY), on the project's own domain
# since 2026-10-20. The earlier one stays beside it for the appliances that have not updated yet.
[[routes]]
pattern = "reports.npuforge.org"
custom_domain = true

[[routes]]
pattern = "reports.eg2.uk"
custom_domain = true
