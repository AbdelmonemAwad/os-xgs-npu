#
# A bridge's link acted on as OPNsense acts on an Ethernet port's (issue 911).
#
# OPNsense's own rule, /usr/local/etc/devd/ifnet.conf, runs `rc.linkup` only for interfaces whose
# media is Ethernet or 802.11. A bridge has no media, so its link going down or up was never acted
# on - and these appliances bridge their front ports as LAN. With the ports saying their link state is
# real (#917), the bridge's link is true: down when no member has a cable, up when one has. So the same
# two calls ifnet.conf makes, for a bridge: `stop` suspends the interface (static addresses are kept),
# `start` applies it again - as plugging a cable into a LAN port on any OPNsense does.
notify 101 {
	match "system"		"IFNET";
	match "subsystem"	"bridge[0-9]+";
	match "type"		"LINK_UP";
	action "/usr/local/sbin/configctl interface linkup start $subsystem";
};

notify 101 {
	match "system"		"IFNET";
	match "subsystem"	"bridge[0-9]+";
	match "type"		"LINK_DOWN";
	action "/usr/local/sbin/configctl interface linkup stop $subsystem";
};
