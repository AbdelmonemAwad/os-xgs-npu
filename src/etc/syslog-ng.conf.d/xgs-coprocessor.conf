#
# The coprocessor's own log, as it reaches this host (2026-10-28). The coprocessor's syslogd keeps
# its log in RAM, lost at each of its resets, and hands every line to a forwarder that sends them
# to this host's end of the management link, port 514, once it is told where
# (scripts/xgs/npu-log.sh): by TCP, each line framed by its length, and by UDP while TCP is
# refused. pf redirects that port here (xgs.inc): syslog-ng starts before the interfaces have
# their addresses, so it cannot listen on the link's own, and one source that cannot bind stops it
# whole.
#
# A source of its own, never s_all: the coprocessor's kernel, sshd or ntpd would otherwise be filed
# by OPNsense's filters among this host's. Each line is dated when it arrives - the coprocessor's
# clock reads 1970 or 2097 until this host sets it (scripts/xgs/npu-clock.sh), and its times carry
# no zone - and is written as OPNsense writes its own logs, a file a day under
# /var/log/xgs/coprocessor, which the Coprocessor Log page of the XGS section reads. OPNsense's log
# rotation keeps it as long as the others (System: Settings: Logging); it is written whether or not
# OPNsense's own local logging is on.
#

source s_xgs_coprocessor {
    syslog(ip("127.0.0.1") port(5140) transport("tcp") keep-timestamp(no));
    network(ip("127.0.0.1") port(5140) transport("udp") keep-timestamp(no));
};

# The host named coprocessor, and the sender's address as RFC 5424's origin: OPNsense's log viewer
# reads a line as RFC 5424 only when it carries structured data - its own carry syslog-ng's
# sequence number - and without it showed the whole line under Line, with no date or process.
rewrite r_xgs_coprocessor {
    set("coprocessor", value("HOST"));
    set("${SOURCEIP}", value(".SDATA.origin.ip"));
};

destination d_xgs_coprocessor {
    file(
        "/var/log/xgs/coprocessor/coprocessor_${YEAR}${MONTH}${DAY}.log"
        create-dirs(yes)
        flags(syslog-protocol)
    );
};

log {
    source(s_xgs_coprocessor);
    rewrite(r_xgs_coprocessor);
    destination(d_xgs_coprocessor);
};
