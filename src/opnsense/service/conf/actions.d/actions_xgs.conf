[status]
command:/usr/local/opnsense/scripts/xgs/status.py
parameters:
type:script_output
message:Read the coprocessor status
description:Report the XGS coprocessor's state as JSON

[offload]
command:/usr/local/opnsense/scripts/xgs/offload.sh
parameters:
type:script_output
message:Apply the acceleration gate
description:Write FW_CFG_OFFLOAD to the coprocessor as the settings page left it

# XGS: Updates. update.py answers in JSON; the update itself is started
# detached, because it builds the driver and takes minutes, and the page follows its log.
[update.status]
command:/usr/local/opnsense/scripts/xgs/update.py status
parameters:
type:script_output
message:Read the state of the XGS coprocessor updates
description:Report what is installed, what the last check found and what the last update did

[update.check]
command:/usr/local/opnsense/scripts/xgs/update.py check
parameters:
type:script_output
message:Check GitHub for an XGS coprocessor update
description:Find the newest commit whose checks passed and what changed since the installed one

[update.apply]
command:/usr/sbin/daemon -f /usr/local/opnsense/scripts/xgs/update.py apply
parameters:
type:script
message:Install the XGS coprocessor update
description:Download the checked commit and run its installer; the driver loads at the next boot

[update.channel]
command:/usr/local/opnsense/scripts/xgs/update.py channel
parameters:%s
type:script_output
message:Set the channel the XGS coprocessor updates follow
description:releases (the default) or main; with no parameter, which one it is

[plugins.list]
command:/usr/local/opnsense/scripts/xgs/plugins.py list
parameters:
type:script_output
message:Read the XGS appliance plugins' releases
description:Report each installed appliance plugin, its last check and its last update, as JSON

[plugins.check]
command:/usr/local/opnsense/scripts/xgs/plugins.py check
parameters:
type:script_output
message:Check GitHub for XGS appliance plugin releases
description:Ask each installed appliance plugin's self-update for its latest release, and keep the answers

[plugins.update]
command:/usr/local/opnsense/scripts/xgs/plugins.py update
parameters:%s
type:script_output
message:Install an XGS appliance plugin's latest release
description:Start one plugin's own self-update, detached; the installer restarts configd and the web GUI

[plugins.install]
command:/usr/local/opnsense/scripts/xgs/plugins.py install
parameters:%s
type:script_output
message:Install an XGS appliance plugin that is not installed
description:Fetch the plugin's latest release's own self-update and run it, detached; the installer restarts configd and the web GUI

[plugins.update-all]
command:/usr/local/opnsense/scripts/xgs/plugins.py update-all
parameters:
type:script_output
message:Install every XGS appliance plugin release the last check offered
description:Start each offered plugin's own self-update, one after the other, detached

[update.log]
command:/usr/local/opnsense/scripts/xgs/update.py log
parameters:
type:script_output
message:Read the XGS coprocessor update log
description:The last update's log

[apply]
command:/usr/local/bin/php /usr/local/opnsense/scripts/xgs/apply.php
parameters:
type:script_output
message:Apply the XGS coprocessor settings
description:Write each setting of the coprocessor's settings page where it takes effect

[ports]
command:/usr/local/opnsense/scripts/xgs/portmap.py
parameters:
type:script_output
message:Read the XGS coprocessor's ports
description:Report the front ports, the expansion module and the switch chip as JSON

[ipsec]
command:/usr/local/opnsense/scripts/xgs/ipsec.py
parameters:
type:script_output
message:Read IPsec in the XGS coprocessor's engine
description:Report the engine's associations and counters as JSON

[reassign]
command:/bin/sh /usr/local/opnsense/scripts/xgs/reassign.sh
parameters:
type:script_output
message:Let the next boot assign the XGS front ports again
description:Remove the first-boot assignment's mark

# Problem reports (scripts/xgs/reporter.py, docs/problem-reports.md). A report is named by its
# sixteen-hex-digit fingerprint; the manual one arrives as base64, so no text reaches a shell.
[report.collect]
command:/usr/local/opnsense/scripts/xgs/reporter.py collect
parameters:
type:script_output
message:Look for problems to report
description:Find new problems on this appliance and send them if sending is automatic

[report.list]
command:/usr/local/opnsense/scripts/xgs/reporter.py list
parameters:
type:script_output
message:List the problem reports
description:The problem reports and the reporting mode, as JSON

[report.show]
command:/usr/local/opnsense/scripts/xgs/reporter.py show
parameters:%s
type:script_output
message:Show a problem report
description:Exactly what is sent for one problem report

[report.send]
command:/usr/local/opnsense/scripts/xgs/reporter.py send
parameters:%s
type:script_output
message:Send a problem report
description:Send one problem report to the relay now

[report.dismiss]
command:/usr/local/opnsense/scripts/xgs/reporter.py dismiss
parameters:%s
type:script_output
message:Dismiss a problem report
description:Forget one problem report until it happens again

[report.manual]
command:/usr/local/opnsense/scripts/xgs/reporter.py manual
parameters:%s
type:script_output
message:Write a problem report
description:Queue a problem report written by the owner

[report.acknowledge]
command:/usr/local/opnsense/scripts/xgs/reporter.py acknowledge
parameters:
type:script_output
message:Acknowledge how problem reports work
description:The owner has seen the reporting setting; the notice goes away

[transceivers.show]
command:/usr/local/opnsense/scripts/xgs/transceivers.py show
parameters:
type:script_output
message:Read the XGS front cages' modules, as last read
description:Report the modules in the front cages and their diagnostics, as last read

[portstats.show]
command:/usr/local/opnsense/scripts/xgs/portstats.py show
parameters:
type:script_output
message:Read the kept XGS switch port counters
description:Report the switch's counters for each panel port, as last read, as JSON

[portstats.collect]
command:/usr/local/opnsense/scripts/xgs/portstats.py collect
parameters:
type:script_output
message:Read the XGS switch port counters now
description:Ask the coprocessor for the switch's counters for each panel port, keep them, as JSON

[poe.show]
command:/usr/local/opnsense/scripts/xgs/poe.py show
parameters:
type:script_output
message:Read the XGS PoE controller
description:Report the PoE ports, their power and what the controller detects, as JSON

[poe.apply]
command:/usr/local/opnsense/scripts/xgs/poe.py apply
parameters:
type:script_output
message:Switch the XGS PoE ports as configured
description:Switch each PoE port off or on as XGS: Ports has it, and report what reads back

[poe.cycle]
command:/usr/local/opnsense/scripts/xgs/poe.py cycle
parameters:%s
type:script_output
message:Switch an XGS PoE port off and on again
description:Switch one PoE port's power off and, three seconds later, on again

[transceivers.collect]
command:/usr/local/opnsense/scripts/xgs/transceivers.py collect
parameters:
type:script_output
message:Read the XGS front cages' modules on the coprocessor
description:Read the modules in the front cages and their diagnostics on the coprocessor now

[bundle]
command:/usr/local/opnsense/scripts/xgs/bundle.py
parameters:
type:script_output
message:Make an XGS support bundle
description:Make a cleaned support bundle and print it as base64 JSON

[flows]
command:/usr/local/opnsense/scripts/xgs/flows.py
parameters:
type:script_output
message:Read the connections the XGS coprocessor forwards
description:Report the connections the coprocessor forwards by itself, from the driver's table, as JSON

# Not [flows.summary]: configd reads a dot as a level, and "flows" is an action of its own.
[flowsummary]
command:/usr/local/opnsense/scripts/xgs/flows.py summary
parameters:
type:script_output
message:Read the XGS coprocessor's flow figures
description:The figures of the connections the coprocessor forwards, without the table, for the dashboard

[flowrelease]
command:/usr/local/opnsense/scripts/xgs/flows.py release
parameters:%s
type:script_output
message:Hand an XGS coprocessor connection back to the host
description:Take one connection out of the coprocessor and keep it with the host until pf lets it go

[coprocessor.show]
command:/usr/local/opnsense/scripts/xgs/coprocessor.py show
parameters:
type:script_output
message:Read the XGS coprocessor's software, chips and storage, as last read
description:Report the coprocessor's software versions, its chips, its flash and its eMMC, as last read

[coprocessor.collect]
command:/usr/local/opnsense/scripts/xgs/coprocessor.py collect
parameters:
type:script_output
message:Read the XGS coprocessor's software, chips and storage now
description:Ask the coprocessor for its software versions, chips, flash and eMMC, read-only, and keep them

[coprocessor.slots]
command:/usr/local/opnsense/scripts/xgs/coprocessor.py slots
parameters:
type:script_output
message:Read what the XGS coprocessor's unmounted eMMC partitions hold
description:Open each eMMC partition nothing has mounted read-only for a moment and report what it holds

[fpcounters.show]
command:/usr/local/opnsense/scripts/xgs/fpcounters.py show
parameters:
type:script_output
message:Read the XGS coprocessor's fast-path counters
description:Report the coprocessor's fast-path counters that are not zero, named for its software, as JSON

[fpcounters.clear]
command:/usr/local/opnsense/scripts/xgs/fpcounters.py clear
parameters:
type:script_output
message:Zero the XGS coprocessor's fast-path counters
description:Zero the coprocessor's fast-path counters, then report the ones not zero, as JSON
