###################################################################
# Local syslog-ng configuration filter definition [xgs].
#
# The coprocessor's log, shown on the Log File page of its menu section: the XGS 3300's bring-up,
# kernel follower and shutdown (octep, octep-follow, octep-stop - program() matches anywhere in
# the name), the XGS 136's driver hook, gate and reset (npuep, npuctl), the first-boot port
# assignment (xgs-assign), the switch chip's jumbo mode (xgs-switch), and the connections cut when
# a block list gains their address (xgs-lists) or by their TLS fingerprint (xgs-ja4).
###################################################################
filter f_local_xgs {
    program("octep") or program("npuep") or program("npuctl") or program("xgs-assign") or program("xgs-switch") or program("xgs-lists") or program("xgs-ja4");
};
