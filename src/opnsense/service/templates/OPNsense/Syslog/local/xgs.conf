###################################################################
# Local syslog-ng configuration filter definition [xgs].
#
# The coprocessor's log, shown on the Log File page of its menu section: the XGS 3300's bring-up,
# kernel follower and shutdown (octep, octep-follow, octep-stop - program() matches anywhere in
# the name), the XGS 136's driver hook, gate and reset (npuep, npuctl), the first-boot port
# assignment (xgs-assign), the switch chip's jumbo mode (xgs-switch), and the connections cut when
# a block list gains their address (xgs-lists) or by their TLS fingerprint (xgs-ja4), and the unusual
# traffic reported (xgs-anomaly).
#
# And since 2026-10-28 the rest of the tags the plugin logs under, which went to the general log
# only: the XGS 3300's board flags - a fan under speed, a power supply not good, the reset button
# (xgs-sensors) - the coprocessor's clock set (xgs-npu-clock), its feeder restarted (xgs-feeder),
# its console logger (xgs-console), the host's hardware watchdog (xgs-watchdog), the PoE
# controller (xgs-poe), the captive portal's users (xgs-cp) and why the host last restarted
# (xgs-reset-reason).
###################################################################
filter f_local_xgs {
    program("octep") or program("npuep") or program("npuctl") or program("xgs-assign") or program("xgs-switch") or program("xgs-lists") or program("xgs-ja4") or program("xgs-anomaly") or program("xgs-sensors") or program("xgs-npu-clock") or program("xgs-feeder") or program("xgs-console") or program("xgs-watchdog") or program("xgs-poe") or program("xgs-cp") or program("xgs-reset-reason");
};
