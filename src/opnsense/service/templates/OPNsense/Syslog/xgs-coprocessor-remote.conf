 #
 # The coprocessor's own log to the remote servers OPNsense sends its log to (svc-3-30, 2026-11-14):
 # System: Settings: Logging: Remote. OPNsense writes each enabled destination as d_<uuid> in
 # syslog-ng-destinations.conf, with one log path from s_all; s_all is this host's own lines, and the
 # coprocessor's come in on a source of their own (etc/syslog-ng.conf.d/xgs-coprocessor.conf) so that
 # OPNsense's local filters do not file its kernel, sshd or ntpd among this host's. So this overlay on
 # the Syslog templates (+TARGETS.D/xgs.TARGET), written with them each time OPNsense writes them, adds
 # a second log path to each of those destinations: from s_xgs_coprocessor, the host named
 # coprocessor (r_xgs_coprocessor), through the destination's own program, level and facility choices
 # as filters of this file. The destination itself is OPNsense's - its address, transport, format and
 # TLS - and is not written again, so a destination switched off or removed there sends nothing more
 # from here either. Nothing to set on the XGS pages: the coprocessor's log follows OPNsense's.
 #}
{% if not helpers.empty('OPNsense.Syslog.destinations.destination') %}
{%    for destination in helpers.toList('OPNsense.Syslog.destinations.destination') %}
{%        if destination.enabled|default('0') == '1' and destination.transport in ['udp4', 'udp6', 'tcp4', 'tcp6', 'tls4', 'tls6'] %}
{%            set dest_key = destination['@uuid']|replace('-', '') %}
{%            set applied_filters = [] %}

### the coprocessor's log to {{destination['@uuid']}} : {{destination.description|default("")}} ####
{%            for key in ['program', 'level', 'facility'] %}
{%                if destination[key] %}
filter f_xgs_{{dest_key}}_{{key}} {
{%                    if key == 'program' %}
{%                        set prog_list = ('program("%s")' % destination[key]).replace(',', '"),program("').split(',') %}
    {{ prog_list|join(' or ') }}
{%                    else %}
    {{ "%s(%s)" % (key, destination[key]) }}
{%                    endif %}
};
{%                    do applied_filters.append(key) %}
{%                endif %}
{%            endfor %}

log {
    source(s_xgs_coprocessor);
    rewrite(r_xgs_coprocessor);
{%            for filter in applied_filters %}
    filter(f_xgs_{{dest_key}}_{{filter}});
{%            endfor %}
    destination(d_{{dest_key}});
};
{%        endif %}
{%    endfor %}
{% endif %}
