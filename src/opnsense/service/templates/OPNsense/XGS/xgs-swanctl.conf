{#
 # SPDX-License-Identifier: BSD-2-Clause
 # Copyright (c) 2026 Abdelmonem Awad <eg2@live.com>
 #
 # XGS: Settings' additions to OPNsense's swanctl.conf (plan 01, package 3.4). swanctl.conf ends with
 # "include conf.d/*.conf" (plugins.inc.d/ipsec.inc), and strongSwan merges a section named again into
 # the one already there, so the connections and their children are named here by the uuids OPNsense
 # names them by, and only the keys added are given:
 #
 #   rand_time  ipsec_rand_time, on every enabled connection of VPN: IPsec: Connections and each of its
 #              enabled children: the random margin taken off their rekey times, so tunnels made
 #              together do not all rekey together. Empty: strongSwan's own, the gap between the life
 #              and rekey times.
 #   ipcomp     on the children ipsec_ipcomp names, compression of what the tunnel carries - not while
 #              IPsec is in the coprocessor's engine (ipsec_offload), where it has not been measured.
 #
 # Written again by the plugin's ipsec configure hook (xgs_ipsec_configure) each time OPNsense writes
 # swanctl.conf, and by a save of XGS: Settings, so no connection taken away is left named here. The
 # tunnels of the legacy IPsec pages are not touched.
 #}
{% set rand = OPNsense.XGS.general.ipsec_rand_time|default('') %}
{% if OPNsense.XGS.general.ipsec_offload|default('1') == '1' %}
{%   set comp = [] %}
{% else %}
{%   set comp = (OPNsense.XGS.general.ipsec_ipcomp|default('')).split(',') %}
{% endif %}
# Written by XGS: Settings (os-xgs-npu); swanctl.conf includes it.
{% if rand != '' or comp|select|list|length > 0 %}
connections {
{%   for conn in helpers.toList('OPNsense.Swanctl.Connections.Connection') %}
{%     if conn.enabled|default('1') == '1' %}
    {{ conn['@uuid'] }} {
{%       if rand != '' %}
        rand_time = {{ rand }}
{%       endif %}
        children {
{%       for child in helpers.toList('OPNsense.Swanctl.children.child') %}
{%         if child.connection|default('') == conn['@uuid'] and child.enabled|default('1') == '1' %}
            {{ child['@uuid'] }} {
{%           if rand != '' %}
                rand_time = {{ rand }}
{%           endif %}
{%           if child['@uuid'] in comp %}
                ipcomp = yes
{%           endif %}
            }
{%         endif %}
{%       endfor %}
        }
    }
{%     endif %}
{%   endfor %}
}
{% endif %}
